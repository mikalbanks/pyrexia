[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrexia-lab"
version = "0.5.0"
description = "Reproducible biocomputing experiment workstation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.121.1", "uvicorn==0.38.0", "python-multipart==0.0.20", "numpy==2.3.4", "plotly==6.4.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "httpx==0.28.1", "playwright==1.56.0"]
cortical = ["cl-sdk==1.0.0"]

[tool.setuptools.packages.find]
include = ["pyrexia*"]

[tool.setuptools.package-data]
pyrexia = ["web/*", "resources/*.csv", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
